# Enable true color support
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# Put the status bar at the bottom
set-option -g status-position bottom

# Enable mouse scrolling and clicking
set -g mouse on

# System clipboard integration (requires xclip)
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Reduce scroll jump distance (tmux defaults to 5 lines per scroll tick)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Open new panes and windows in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable automatic restore on boot
set -g @continuum-restore 'on'

# Enable image previews for yazi
set -g allow-passthrough on
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm-kitty:RGB'
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# ctrl + Space for leader
unbind C-b
set -g prefix C-Space
bind C-space send-prefix

# Enable focus events for Neovim auto-save
set -g focus-events on
